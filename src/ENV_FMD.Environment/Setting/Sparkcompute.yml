enable_native_execution_engine: true
# Conservative default that starts on any capacity; raise it on a bigger one.
# Worst case here is driver(4,28g) + 2 executors(4,28g) = 12 cores / 84g.
# Do not edit these four values here: the setup notebook overwrites them from
# manifest.yaml (spark.default, plus spark.overrides.<environment>) at deploy time.
driver_cores: 4
driver_memory: 28g
executor_cores: 4
executor_memory: 28g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 2
runtime_version: 2.0