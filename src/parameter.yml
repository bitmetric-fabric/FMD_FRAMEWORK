    replace_value:
      Development: "8f751fe0-14de-4dd6-a61e-d5af084012c5"
      Test: "8f751fe0-14de-4dd6-a61e-d5af084012c5"
      Production: "8f751fe0-14de-4dd6-a61e-d5af084012c5"
    item_type: "DataPipeline"
