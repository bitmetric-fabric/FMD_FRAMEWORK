name: Deploy INTEGRATION code workspace

# Ongoing CI/CD for src/ (excluding business_domain/) into the INTEGRATION CODE
# workspaces. This is separate from setup/NB_SETUP_FMD.ipynb, which only handles
# one-time initial provisioning and isn't used for day-to-day development.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/business_domain/**"
      - "!src/SQL_FMD_FRAMEWORK.SQLDatabase/**"
      - "scripts/deploy_fabric_cicd.py"
      - ".github/workflows/deploy-integration.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options: [development, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Deploy to Fabric
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/deploy_fabric_cicd.py ${{ inputs.environment || 'development' }}
